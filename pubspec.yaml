name: ai_reel_studio
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  file_picker: ^11.0.3
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown: ^0.7.5
  crypto: ^3.0.6
  flutter_riverpod: ^2.6.1
  go_router: ^16.1.0
  kyroon_pty: ^1.0.6
  media_kit: ^1.2.6
  media_kit_libs_windows_video: ^1.0.11
  media_kit_video: ^2.0.1
  # 2.2.x 才能与 flterm(hooks 2) 共存；用本地 opencv.full 预编译（见 fetch/patch 脚本）
  opencv_dart: 2.2.2
  path: ^1.9.0
  path_provider: ^2.1.5
  desktop_drop: ^0.5.0
  screen_retriever: ^0.2.2
  shared_preferences: ^2.5.3
  watcher: ^1.2.1
  window_manager: ^0.4.3
  # pub.dev 最新仍为 0.0.5；TUI 滚轮修复在 upstream main 未发版。
  # 发版后可升版本；发版前勿把整库 vendor 进仓库。
  flterm: ^0.0.5
  re_editor: ^0.10.0
  re_highlight: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# dartcv4：只编抽帧需要的模块；OpenCV SDK 由 scripts/fetch_opencv_full.ps1 镜像预置。
hooks:
  user_defines:
    dartcv4:
      include_modules:
        - imgcodecs
        - imgproc
        - videoio

flutter:
  uses-material-design: true
